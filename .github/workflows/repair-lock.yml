name: Reparar lockfile uma vez
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-lock.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconciliar lockfile usando o npm
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Confirmar instalacao limpa
        run: npm ci
      - name: Registrar apenas lockfile corrigido
        run: |
          git config user.name "contaflow-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Repara lockfile para instalacao reproduzivel"
            git push origin HEAD:main
          fi
