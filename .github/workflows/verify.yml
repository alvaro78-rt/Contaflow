name: Verificar ContaFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Auditoria de dependencias com vulnerabilidades altas
        run: npm audit --audit-level=high
      - name: Testes do frontend
        run: node --test tests/*.test.js
      - name: Integração HTTP da folha com SQLite e dados fictícios
        run: node --test tests/homologacao/folha.js
      - name: Lint
        run: npm run lint
      - name: Tipagem
        run: npm run typecheck
      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testes de backend com entidades fictícias em memória
        run: deno test --no-config --no-check --no-lock --node-modules-dir=none --import-map=tests/import-map.json tests/backend_test.js
      - name: Integração HTTP local com dados fictícios
        run: deno test --allow-net=127.0.0.1 --no-config --no-check --no-lock --node-modules-dir=none --import-map=tests/import-map.json tests/http_integration.js
